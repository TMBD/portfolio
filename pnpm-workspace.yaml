# pnpm settings. Since pnpm 11, pnpm-specific options are read from here rather
# than from .npmrc, which now only carries registry and auth configuration.

# Flat, npm-style node_modules layout instead of pnpm's default symlinked store.
# Maximizes compatibility with Astro, astro-icon, Tailwind v4 and sharp, and
# avoids "cannot find module" edge cases on CI.
nodeLinker: hoisted

# Dependency install scripts are blocked by default since pnpm 10; only packages
# listed here may run them. esbuild needs it to link its platform binary.
allowBuilds:
  esbuild: true
